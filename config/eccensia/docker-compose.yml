# ECCENSIA stack — Hetzner VPS (CPX11, Ubuntu 24.04)
# Location on host: /opt/apps/eccensia/docker-compose.yml
# Reads secrets from sibling .env file (see .env.example).

networks:
  net_proxy:
  net_behemoth:

volumes:
  behemoth_data:

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/webroot:/var/www/certbot:ro
    depends_on:
      - eccensia
    networks: [net_proxy]
    restart: unless-stopped

  eccensia:
    image: ghcr.io/sergiod3v/eccensia:latest
    expose:
      - "80"
    networks: [net_proxy]
    restart: unless-stopped

  behemoth:
    image: ghcr.io/sergiod3v/auto-trading:latest
    volumes:
      - behemoth_data:/app/data
    environment:
      - AWS_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - BEHEMOTH_SSM_ENV=staging
      - BEHEMOTH_SYMBOLS=BTC/USDT
      - BEHEMOTH_INTERVAL=1d
      - BEHEMOTH_EXCHANGE=okx
    networks: [net_behemoth]
    restart: unless-stopped
