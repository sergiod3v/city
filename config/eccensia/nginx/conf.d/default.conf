# Eccensia SPA — HTTP only on Hetzner (no TLS yet).
# ACME challenge path kept so certbot can be added without nginx restart.
server {
    listen 80;
    server_name eccensia.com www.eccensia.com eccensia.sergiod3v.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://eccensia:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
