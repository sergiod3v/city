# HTTP → HTTPS for all domains + ACME challenge
server {
    listen 80;
    server_name bijadillo.com *.bijadillo.com eccensia.com www.eccensia.com eccensia.sergiod3v.cloud;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# mercadillo.bijadillo.com → mercadillo-front:3000
server {
    listen 443 ssl;
    server_name mercadillo.bijadillo.com;
    ssl_certificate /etc/letsencrypt/live/mercadillo.bijadillo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercadillo.bijadillo.com/privkey.pem;
    location / {
        proxy_pass http://mercadillo-front:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

