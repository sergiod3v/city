#cloud-config
# Hetzner CPX11 bootstrap — Ubuntu 24.04
# Provides: hardened SSH, UFW, fail2ban, swap, Docker, log rotation

# ─── User ───────────────────────────────────────────────
users:
  - name: alejo
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIhSepfxlWMCrtbPuvqO0vwWyizrBODCWqvmRAh/3Mx alejo@bogota-main

# ─── System ─────────────────────────────────────────────
timezone: America/Bogota
locale: en_US.UTF-8

package_update: true
package_upgrade: true

packages:
  - ufw
  - fail2ban
  - htop
  - curl
  - git
  - vim
  - ca-certificates
  - gnupg
  - lsb-release
  - unattended-upgrades
  - apt-listchanges

# ─── Files ──────────────────────────────────────────────
write_files:
  - path: /etc/fail2ban/jail.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      port = ssh
      maxretry = 3
      bantime = 3600
      findtime = 600

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/sysctl.d/99-tuning.conf
    permissions: "0644"
    content: |
      vm.swappiness=10
      vm.overcommit_memory=1
      net.ipv4.tcp_fin_timeout=15
      net.core.somaxconn=1024

  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

# ─── Commands ───────────────────────────────────────────
runcmd:
  # SSH hardening
  - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
  - systemctl restart ssh

  # UFW firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # fail2ban
  - systemctl enable --now fail2ban

  # Sysctl
  - sysctl --system

  # Swap 2GB
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # Docker (official repo)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker alejo
  - systemctl enable --now docker
  - systemctl restart docker

  # App dir
  - mkdir -p /opt/apps
  - chown alejo:alejo /opt/apps

  # Marker file (lets fallback script detect cloud-init success)
  - touch /var/lib/cloud-init-success

final_message: "Bootstrap done. SSH alejo@<ip>. Run post-creation.sh for dev env."
